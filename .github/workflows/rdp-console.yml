name: RDP Console

on:
  push:
    branches: [feature/rdp-console]
    paths:
      - 'rdp_bridge.go'
      - 'rdp_bridge_test.go'
      - 'native.go'
      - 'video.go'
      - 'main.go'
      - '.github/workflows/rdp-console.yml'
  pull_request:
    paths:
      - 'rdp_bridge.go'
      - 'rdp_bridge_test.go'
      - 'native.go'
      - 'video.go'
      - 'main.go'
      - '.github/workflows/rdp-console.yml'
  workflow_dispatch:

concurrency:
  group: rdp-console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Docker build context
        run: ./scripts/ci_helper.sh prepare
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT_DIR }}
          file: ${{ env.DOCKER_BUILD_CONTEXT_DIR }}/Dockerfile.build
          tags: ${{ env.DOCKER_BUILD_TAG }}
          push: false
          load: true
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.25.1'
      - name: Build application
        run: ./scripts/ci_helper.sh make build_dev SKIP_UI_BUILD=1
      - name: Run Go tests
        run: go test ./...
